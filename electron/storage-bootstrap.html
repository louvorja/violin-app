<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
  <title>LouvorJA Violin</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 28px 32px; background: light-dark(#f7fafd, #1f2937); color: light-dark(#143a66, #e5e7eb); }
    h1 { font-size: 22px; margin: 0 0 18px; }
    p { font-size: 14px; line-height: 1.5; margin: 10px 0; }
    #details { font-size: 12px; opacity: .8; }
    progress { width: 100%; height: 6px; accent-color: #b16d00; }
    button { float: right; padding: 7px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1 id="title">Preparando seus dados</h1>
  <progress></progress>
  <p id="status">Preparando o perfil privado…</p>
  <p id="details">Seus arquivos originais serão preservados. Aguarde a conclusão.</p>
  <button id="close" hidden onclick="window.close()">Fechar</button>
  <script>
    const es = new URLSearchParams(location.search).get("language") === "es";
    const texts = es ? {
      title: "Preparando sus datos", scanning: "Revisando los archivos…", copying: "Copiando sus archivos…",
      verifying: "Verificando la copia…", publishing: "Finalizando la preparación…", complete: "Abriendo LouvorJA…",
      preserved: "Se conservarán los archivos originales. Espere a que termine.", files: "archivos procesados", close: "Cerrar", error: "No se pudo completar la preparación", retry: "Los archivos originales se conservaron. Cierre esta ventana para volver a intentarlo.",
    } : {
      title: "Preparando seus dados", scanning: "Conferindo os arquivos…", copying: "Copiando seus arquivos…",
      verifying: "Verificando a cópia…", publishing: "Concluindo a preparação…", complete: "Abrindo o LouvorJA…",
      preserved: "Seus arquivos originais serão preservados. Aguarde a conclusão.", files: "arquivos processados", close: "Fechar", error: "Não foi possível concluir a preparação", retry: "Os arquivos originais foram preservados. Feche esta janela para tentar novamente.",
    };
    document.documentElement.lang = es ? "es" : "pt-br";
    document.getElementById("title").textContent = texts.title;
    document.getElementById("details").textContent = texts.preserved;
    document.getElementById("close").textContent = texts.close;
    window.updateStorageProgress = (value) => {
      if (value.error) {
        document.getElementById("title").textContent = texts.error;
        document.getElementById("status").textContent = value.error;
        document.getElementById("details").textContent = texts.retry;
        document.querySelector("progress").hidden = true;
        document.getElementById("close").hidden = false;
        return;
      }
      document.getElementById("status").textContent = texts[value.phase] || texts.scanning;
      document.getElementById("details").textContent = value.files
        ? `${Number(value.files).toLocaleString()} ${texts.files} · ${Math.round(value.bytes / 1048576).toLocaleString()} MB`
        : texts.preserved;
    };
  </script>
</body>
</html>
