<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>LouvorJA — laser e lousa</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #board {
        position: fixed;
        display: none;
        background: #ffffff;
      }
      #ink {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #laser {
        position: fixed;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0 18%, #ff2a2a 38%, rgba(255, 30, 30, 0.55) 62%, rgba(255, 0, 0, 0) 72%);
        box-shadow: 0 0 18px 6px rgba(255, 40, 40, 0.65);
        display: none;
        pointer-events: none;
        transition: left 40ms linear, top 40ms linear;
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <canvas id="ink"></canvas>
    <div id="laser"></div>
    <script src="presenterOverlay.page.js"></script>
  </body>
</html>
