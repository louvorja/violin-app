name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        # Ver o comentário equivalente em release.yml: retry curto por causa de
        # uma corrida conhecida no teardown do Vitest (RPC onUserConsoleLog),
        # não relacionada aos testes em si.
        run: |
          for attempt in 1 2; do
            if npm test; then
              exit 0
            fi
            echo "::warning::Tentativa $attempt/2 falhou (possível corrida de teardown do Vitest) — tentando de novo"
          done
          exit 1

      - name: Build web
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_URL: /
