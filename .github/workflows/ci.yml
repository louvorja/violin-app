name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Conferir política de instalação npm
        run: node scripts/validate-install-policy.mjs

      - name: Instalar dependências
        run: npm ci
        env:
          HUSKY: "0"

      - name: Rodar testes
        # Ver o comentário equivalente em release.yml: retry curto por causa de
        # uma corrida conhecida no teardown do Vitest (RPC onUserConsoleLog),
        # não relacionada aos testes em si.
        run: |
          for attempt in 1 2; do
            if npm test; then
              exit 0
            fi
            echo "::warning::Tentativa $attempt/2 falhou (possível corrida de teardown do Vitest) — tentando de novo"
          done
          exit 1

      - name: Build web
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_URL: /

      - name: Instalar navegadores dos testes de interface
        run: npx playwright install --with-deps chromium webkit

      - name: Rodar testes E2E
        # A suíte completa também roda na release; rodá-la aqui faz a falha
        # aparecer no commit que a causou, e não 25 minutos depois, na tag.
        # Dois workers: o runner tem 4 vCPU e a suíte cai pela metade.
        run: npm run test:e2e -- --workers=2

      - name: Conferir estilos do build contra o desenvolvimento
        run: npm run test:e2e:build

      - name: Conferir web Android e iPhone no build PWA
        run: npm run test:e2e:mobile:build

  # O app Electron só abre com display: xvfb dá uma tela virtual ao runner.
  # Um teste opt-in (LJ_RUN_REMOTE_MUSIC_ALBUM=1) para o caminho que mais dói
  # no controle remoto: álbum que só existe no IndexedDB, offline.
  e2e-electron:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          HUSKY: "0"

      - name: Instalar bibliotecas do Electron e do Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium

      - name: Rodar o E2E do Electron (xvfb)
        run: |
          set -o pipefail
          xvfb-run -a npm run test:e2e:electron 2>&1 | tee e2e-electron.log

      - name: Guardar o log do E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-electron-log
          path: |
            e2e-electron.log
            playwright-report/
          retention-days: 7
