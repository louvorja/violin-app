name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dist
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      previous_sha: ${{ steps.previous_deploy.outputs.sha }}
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Obter a publicação anterior
        id: previous_deploy
        run: |
          git fetch --no-tags origin +refs/heads/dist:refs/remotes/origin/dist
          mkdir -p "$RUNNER_TEMP/previous-dist"
          git archive refs/remotes/origin/dist | tar -x -C "$RUNNER_TEMP/previous-dist"
          echo "sha=$(git rev-parse refs/remotes/origin/dist)" >> "$GITHUB_OUTPUT"
          echo "created_at=$(git show -s --format=%cI refs/remotes/origin/dist)" >> "$GITHUB_OUTPUT"
      - name: Validar política de instalação
        run: node scripts/validate-install-policy.mjs
      - name: Instalar dependências sem ganchos
        run: npm ci --ignore-scripts --no-audit
      - name: Validar source maps do PostHog
        run: npm run validate:observability-release
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          REQUIRE_POSTHOG_SOURCEMAPS: "true"
      - name: Gerar site
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_URL: /
          VITE_URL_DATABASE: ${{ vars.VITE_URL_DATABASE }}
          VITE_URL_FILES: ${{ vars.VITE_URL_FILES }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          REQUIRE_POSTHOG_SOURCEMAPS: "true"
      # O SW já foi gerado: assets retidos ficam no servidor, fora do precache.
      # Até cinco builds completos (atual + quatro), 14 dias e 128 MiB.
      - name: Reter assets das abas abertas
        env:
          PREVIOUS_DEPLOY_AT: ${{ steps.previous_deploy.outputs.created_at }}
        run: node scripts/retain-web-assets.mjs dist "$RUNNER_TEMP/previous-dist" "$PREVIOUS_DEPLOY_AT"
      - name: Preparar arquivos de publicação
        run: cp dist/index.html dist/404.html
      - name: Guardar site para a branch dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Guardar site para o GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  publish:
    # Isolado do build: o runner que tem `contents: write` na memória do
    # Runner.Worker nunca executa `npm ci`, o build nem código de terceiros.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar site gerado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - name: Publicar na branch dist
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIST: ${{ needs.build.outputs.previous_sha }}
        run: |
          git init --initial-branch=dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Deploy ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"

          # A retenção partiu desta dist; se ela mudou desde o build, não sobrescreve.
          git push --force-with-lease="refs/heads/dist:$EXPECTED_DIST" origin HEAD:refs/heads/dist

  pages:
    name: Publicar no GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
