name: Release

on:
  push:
    tags:
      # Releases estáveis: vMAJOR.MINOR.PATCH (ex: v1.28.0)
      - "v*.*.*"
      # Pre-releases: vMAJOR.MINOR.PATCH-IDENT (ex: v1.28.0-preview.1, v1.28.0-rc.1)
      - "v*.*.*-*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: installer-windows
            artifact_glob: |
              dist_electron/*.exe
              dist_electron/*.blockmap
              dist_electron/latest.yml
          - os: macos-latest
            platform: mac
            artifact: installer-macos
            artifact_glob: |
              dist_electron/*.dmg
              dist_electron/*.zip
              dist_electron/*.blockmap
              dist_electron/latest-mac.yml
          - os: ubuntu-latest
            platform: linux
            artifact: installer-linux
            artifact_glob: |
              dist_electron/*.AppImage
              dist_electron/*.deb
              dist_electron/*.rpm
              # O curinga cobre o `latest-linux-arm64.yml`. Nomeado à mão, só o
              # x64 subia: os pacotes ARM iam para a release sem o arquivo que
              # o updater procura, e a máquina ARM levava 404 ao verificar.
              dist_electron/latest-linux*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Conferir versão da release
        run: npm run validate:release-version

      - name: Rodar testes
        run: npm test

      - name: Rodar lint
        run: npm run lint

      - name: Instalar navegador dos testes E2E
        run: npx playwright install chromium

      - name: Rodar testes E2E
        run: npm run test:e2e

      - name: Habilitar long paths (Windows)
        if: matrix.platform == 'win'
        run: git config --global core.longpaths true

      # O electron-builder baixa o fpm bundled, mas para gerar .rpm ele delega
      # ao rpmbuild do sistema (e exige xz). O runner ubuntu-latest não traz
      # essas ferramentas por padrão — sem elas o job Linux falha.
      - name: Instalar ferramentas RPM
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils

      # Assinatura + notarização macOS — importa o Developer ID no keychain
      # do runner para o electron-builder (osx-sign) assinar sem prompt.
      - name: Importar certificado Apple (macOS)
        if: matrix.platform == 'mac'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: run0$j4ng$h4cker
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          # Definir o keychain padrão não o coloca na lista de busca, e é a
          # lista que o electron-builder varre para achar o certificado.
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

      - name: Build Electron
        run: npm run electron:build:${{ matrix.platform }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          VITE_BASE_URL: /
          VITE_URL_DATABASE: ${{ vars.VITE_URL_DATABASE }}
          VITE_URL_FILES: ${{ vars.VITE_URL_FILES }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # Assinatura/notarização macOS: usa o keychain importado acima.
          # Nos runners win/linux o certificado não existe → build sem assinatura.
          #
          # Sem CSC_LINK de propósito. Com ele o electron-builder ignora o
          # keychain que o passo anterior montou e cria um temporário só dele,
          # e o `security set-key-partition-list` desse keychain falha de forma
          # intermitente no runner do macOS — foi o que derrubou o build da
          # 2.0.0-beta.3 duas vezes seguidas. A descoberta automática acha o
          # mesmo certificado na lista de busca, sem essa segunda montagem.
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Conferir arquivos do atualizador
        run: npm run validate:release-artifacts

      - name: Upload instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 7
          if-no-files-found: error

  publish:
    # Só publica quando o build foi disparado por uma tag — evita criar
    # release vazia em workflow_dispatch sem tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar artifacts dos 3 OSes (macOS Intel + ARM)
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Detectar pre-release
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=LouvorJA Violin ${GITHUB_REF_NAME#v} (pré-visualização)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=LouvorJA Violin ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar texto final da release
        id: notes
        env:
          RELEASE_NOTES_FILE: .github/release-notes/${{ github.ref_name }}.md
        run: |
          set -euo pipefail
          if [[ ! -s "$RELEASE_NOTES_FILE" ]]; then
            echo "::error::Notas ausentes: $RELEASE_NOTES_FILE"
            exit 1
          fi

          RELEASE_NOTES=$(cat "$RELEASE_NOTES_FILE")
          DELIM_BODY="RELEASE_NOTES_${GITHUB_RUN_ID}"
          {
            printf 'body<<%s\n' "$DELIM_BODY"
            printf '%s\n' "$RELEASE_NOTES"
            printf '%s\n' "$DELIM_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Criar/atualizar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
