# electron-builder configuration for LouvorJA Desktop
# Docs: https://www.electron.build/configuration/configuration

appId: br.com.louvorja.app
productName: LouvorJA Violin

# Entry point do main process (referenciado em package.json "main")
extraMetadata:
  main: electron/main.cjs

# Diretório de saída dos builds
directories:
  output: dist_electron
  buildResources: build

# Arquivos incluídos no pacote asar
files:
  - dist/**/*
  - electron/**/*
  - config/**/*
  - package.json
  - public/ico/**/*

# Arquivos compartilhados entre o main process e o renderer process (copiados para o asar e para o build final)
extraResources: [
  {
    "from": "src/constants",
    "to": "constants",
    "filter": ["**/*"]
  }
]


# Os PNGs do logo precisam ficar fora do asar para que o BrowserWindow
# possa carregá-los pelo path em runtime (Electron lê PNG bem do asar
# normalmente, mas mantemos unpacked como precaução cross-platform).
asarUnpack:
  - public/ico/**/*

# Locales do Chromium — o app fala PT e ES; sem este filtro entram ~660 idiomas
# (com variantes de gênero), ~47 MB só de .lproj/.pak
electronLanguages:
  - pt
  - pt_BR
  - pt-BR
  - pt_PT
  - pt-PT
  - es
  - es_419
  - es-419
  - en
  - en_GB
  - en-GB
  - en-US

# Compressão máxima para reduzir tamanho do instalador
compression: maximum

# Empacotar em asar (melhor performance e segurança)
asar: true

# ---------------------------------------------------------------------------
# Publicação de releases — GitHub Releases (electron-updater)
# ---------------------------------------------------------------------------
# O electron-updater vai buscar aqui por novas versões.
# GH_TOKEN precisa estar definido no ambiente de build para publicar.
publish:
  - provider: github
    owner: louvorja
    repo: violin-app
    private: false
    releaseType: release

# ---------------------------------------------------------------------------
# Windows — NSIS installer
# ---------------------------------------------------------------------------
win:
  target: nsis
  icon: build/icon-512.png
  # Code signing (opcional — requer certificado pago):
  # certificateFile: cert.pfx
  # certificatePassword: ${env.CERT_PWD}
  # signtoolOptions:
  #   signingHashAlgorithms: [sha256]

# Para customizar o visual do instalador NSIS, criar os seguintes arquivos em build/:
#   icon.ico        — ícone do app (256x256, formato ICO)
#   header.bmp      — cabeçalho do instalador (150x57 px, formato BMP)
#   sidebar.bmp     — barra lateral do instalador (164x314 px, formato BMP)
nsis:
  # Instalador com wizard (não one-click) — usuário pode escolher pasta
  oneClick: false
  # Solicitar elevação de privilégios se necessário
  allowElevation: true
  # Permitir ao usuário escolher o diretório de instalação
  allowToChangeInstallationDirectory: true
  # Criar atalho na área de trabalho
  createDesktopShortcut: true
  # Criar atalho no menu iniciar
  createStartMenuShortcut: true
  # Nome do atalho
  shortcutName: LouvorJA Violin
  # Idioma principal do instalador: 1046 = Portuguese (Brazil)
  language: "1046"
  # Suporte a múltiplos idiomas no instalador
  multiLanguageInstaller: true
  # Script NSIS customizado (protocolo louvorja://, etc.)
  include: build/installer.nsh

# ---------------------------------------------------------------------------
# macOS — DMG (Intel x64 + Apple Silicon arm64)
# Cross-build de x64 no runner ARM funciona sem Rosetta: o electron-builder
# baixa os dists do Electron por arquitetura (não há módulos nativos).
# O latest-mac.yml gerado lista ambos — o auto-update escolhe por arch.
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Ícone próprio do macOS: 1024x1024 com a placa já desenhada — o squircle
  # branco na grade da Apple (~82% do canvas), margem transparente em volta.
  #
  # O macOS 26+ recorta qualquer ícone nessa mesma forma, então lá tanto faz;
  # medido, um quadrado opaco de borda a borda e esta placa saem pixel a pixel
  # iguais. O que muda é o macOS 25 e anteriores, que NÃO recortam nada e
  # desenham o .icns como veio: um quadrado opaco vira um quadrado branco de
  # cantos vivos no Dock. Entregar a forma pronta serve as duas gerações.
  #
  # O que não serve é um desenho que deixe transparência DENTRO da placa (o
  # icon-512.png é um círculo): aí o macOS 26+ mostra o cinza dele por baixo.
  # Windows e Linux seguem com o icon-512.png.
  icon: build/icon-mac.png
  category: public.app-category.music
  # Assinatura + notarização (certificado Developer ID + credenciais Apple
  # fornecidas via env no CI: CSC_LINK/CSC_KEY_PASSWORD + APPLE_ID/
  # APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID).
  notarize: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# ---------------------------------------------------------------------------
# Linux — AppImage
# ---------------------------------------------------------------------------
# O caminho oficial no Linux é deb e rpm: cobrem Ubuntu, Mint, Debian, Zorin,
# MX e Pop de um lado, Fedora e openSUSE do outro — que é onde os operadores
# estão. Instalam nativo, sem a camada de runtime que Flatpak e Snap carregam,
# o que também importa no PC fraco de igreja.
#
# O AppImage fica para quem usa distro fora dessas duas famílias, e exige do
# usuário `sudo apt install libfuse2t64` (ou equivalente): o Ubuntu 22.04+ e o
# Fedora recente só trazem a FUSE 3, e o runtime que o electron-builder 26
# embute ainda depende da 2 — sem ela o arquivo não abre, e a mensagem só
# aparece para quem o executou pelo terminal. Medido no Ubuntu 24.04: com a
# biblioteca instalada, o mesmo AppImage roda sem mais nenhum ajuste.
#
# O electron-builder passa a usar um runtime estático, que dispensa a FUSE do
# host, a partir do v27 — hoje só em alpha. Quando ele estabilizar, atualizar a
# dependência resolve isto e este comentário pode sair junto.
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: build/icon-512.png
  category: AudioVideo
  # O ambiente gráfico casa uma janela com o lançador comparando a identidade
  # dela (WM_CLASS no X11, app_id no Wayland) com o .desktop instalado. Sem o
  # par, a janela do LouvorJA aparece no dock do Ubuntu como um ícone genérico
  # de engrenagem, solta do lançador — medido no Ubuntu 24.04.
  # `syncDesktopName` faz o electron-builder carimbar os dois lados a partir do
  # `desktopName` do package.json, que é o caminho que cobre X11 e Wayland; o
  # `executableName` fica igual porque é dele que o Chromium deriva o WM_CLASS.
  executableName: louvorja-violin
  syncDesktopName: true
  # Numa sessão Wayland — o padrão do Ubuntu — o Chromium não consegue pôr uma
  # janela num monitor escolhido: o protocolo não deixa o cliente saber nem
  # definir a própria posição. Medido no Ubuntu 24.04 com dois monitores: a
  # projeção abria em tela cheia SOBRE a tela do operador e o projetor ficava
  # no papel de parede, com o app relatando "resolvido" para o Monitor 2. Sob
  # XWayland tudo funciona, inclusive a área útil, que no Wayland vinha igual
  # aos limites da tela (a janela principal ia parar embaixo da barra do GNOME).
  #
  # Só a forma abaixo tem efeito. `--ozone-platform-hint=x11` é ignorado, e
  # `app.commandLine.appendSwitch` no main chega tarde demais — a plataforma já
  # foi escolhida quando o script JS roda. Por isso vive aqui, no atalho.
  executableArgs:
    - --ozone-platform=x11
